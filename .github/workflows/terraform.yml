name: Terraform EKS deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-eks
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.10.5
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_kubeconfig_bucket: ${{ secrets.TF_STATE_BUCKET }}

jobs:
  deploy:
    name: Validate and deploy EKS architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials from GitHub Secrets
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform with S3 backend
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_VAR_kubeconfig_bucket}" \
            -backend-config="key=eks/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        run: terraform validate

      # The Kubernetes/Helm providers depend on the EKS API endpoint. Create
      # the AWS foundation first, then run a normal full plan/apply after the
      # cluster endpoint and node group exist in state.
      - name: Plan AWS foundation
        run: terraform plan -input=false -out=foundation.tfplan -target=aws_eks_node_group.node_group

      - name: Apply AWS foundation
        run: terraform apply -input=false -auto-approve foundation.tfplan

      - name: Plan complete architecture
        run: terraform plan -input=false -out=complete.tfplan

      - name: Apply complete architecture
        run: terraform apply -input=false -auto-approve complete.tfplan

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Verify EKS cluster and nodes
        run: |
          CLUSTER_NAME="$(terraform output -raw eks_cluster_name)"
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"
          kubectl wait --for=condition=Ready nodes --all --timeout=600s
          kubectl get nodes -o wide
          kubectl -n cert-manager rollout status deployment/cert-manager --timeout=300s
          kubectl -n nginx-ingress rollout status deployment/nginx-ingress-controller --timeout=300s
          kubectl -n argocd rollout status deployment/argocd-server --timeout=300s
          kubectl get storageclass efs-sc
